# בונה את האתר ומעלה אותו ל-GitHub Pages בכל push לענף main.
# אפשר גם להריץ ידנית: Actions > Deploy to GitHub Pages > Run workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # הנתיב והכתובת של האתר — מתמלאים אוטומטית
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # הגדרות PayPal — מ-Settings > Secrets and variables > Actions > Secrets
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_BUTTON_SHIPPING: ${{ secrets.PAYPAL_BUTTON_SHIPPING }}
          VITE_PAYPAL_BUTTON_PICKUP: ${{ secrets.PAYPAL_BUTTON_PICKUP }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
